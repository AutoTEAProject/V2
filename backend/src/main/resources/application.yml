spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autotea}
    username: ${DB_USERNAME:autotea}
    password: ${DB_PASSWORD:autotea}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  codec:
    max-in-memory-size: 50MB

server:
  port: ${PORT:8080}

app:
  python-engine:
    base-url: ${PYTHON_ENGINE_URL:http://localhost:8000}
    timeout-seconds: ${PYTHON_ENGINE_TIMEOUT:300}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-32-bytes-minimum-secret-key}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:604800}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
